name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    steps:
      - name: Process stale issues and PRs
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          exempt-issue-labels: "pinned,good first issue,help wanted"
          exempt-pr-labels: "pinned,good first issue,help wanted"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue has been inactive for 60 days and is now marked stale.
            Remove the stale label or comment to keep it open; otherwise it will
            be closed in 14 days.
          stale-pr-message: >
            This pull request has been inactive for 45 days and is now marked
            stale. Remove the stale label or comment to keep it open; otherwise
            it will be closed in 14 days.
