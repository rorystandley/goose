name: CI

permissions:
  contents: write

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          SLACK_BOT_TOKEN: xoxb-ci-placeholder
          SLACK_APP_TOKEN: xapp-ci-placeholder
          SLACK_SIGNING_SECRET: ci-signing-secret
          LOG_LEVEL: error

      - name: Build coverage badge payload
        run: |
          node -e "const fs=require('node:fs');const summary=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));const pct=summary.total.lines.pct;const color=pct>=90?'brightgreen':pct>=80?'green':pct>=70?'yellowgreen':pct>=60?'yellow':pct>=50?'orange':'red';const badge={schemaVersion:1,label:'coverage',message:pct.toFixed(2)+'%',color};fs.writeFileSync('docs/assets/coverage-badge.json',JSON.stringify(badge,null,2)+'\n');"

      - name: Commit coverage badge payload
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: |
          if git diff --quiet -- docs/assets/coverage-badge.json; then
            echo "Coverage badge is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/coverage-badge.json
          git commit -m "ci: update coverage badge data [skip ci]"
          git push

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-summary-compare-path: coverage/coverage-summary.json
