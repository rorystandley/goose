name: Bug report
description: Report a reproducible bug or regression
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out as much detail as possible.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the problem
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps so maintainers can reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - CLI
        - Slack
        - Web
        - Voice
        - Scheduler
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: node -v

  - type: input
    id: goose
    attributes:
      label: Goose version/commit
      placeholder: v1.0.0 or commit SHA

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/output
      description: Paste logs or stack traces (redact secrets)
      render: shell
